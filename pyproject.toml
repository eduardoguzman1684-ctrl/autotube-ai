[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "autotube-ai"
version = "0.2.0"
description = "Sistema automatizado para producir contenido de YouTube con inteligencia artificial"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-dotenv>=1.0,<2.0",
    "httpx>=0.27,<1.0",
    "google-genai>=2.16,<3.0",
    "edge-tts>=7.0,<8.0",
    "pillow>=10.0,<13.0",
    "playwright>=1.50,<2.0",
    "google-api-python-client>=2.198,<3.0",
    "google-auth>=2.56,<3.0",
    "google-auth-oauthlib>=1.4,<2.0",
    "google-auth-httplib2>=0.4,<1.0",
    "torch>=2.4,<3.0",
    "transformers>=4.48,<6.0",
]

[project.scripts]
autotube = "autotube.main:main"

[tool.setuptools.packages.find]
where = ["src"]
